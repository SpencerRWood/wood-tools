["build-system"]
"requires" = ["setuptools>=68", "wheel"]
"build-backend" = "setuptools.build_meta"

["project"]
"name" = "wood-tools"
"version" = "0.23.0"
"description" = "Deterministic Python CLI tooling for project delivery workflows."
"readme" = "README.md"
"requires-python" = ">=3.14"
"dependencies" = ["pyyaml>=6.0.3"]

["project"."scripts"]
"wood" = "wood.cli:main"

["dependency-groups"]
"dev" = ["mypy>=1.18.0", "pre-commit>=4.0.0", "pytest>=8.0.0", "pytest-cov>=6.0.0", "python-semantic-release>=10.0.0", "ruff>=0.11.0", "types-pyyaml>=6.0.12"]

["tool"]

["tool"."setuptools"]

["tool"."setuptools"."package-dir"]
"" = "src"

["tool"."setuptools"."packages"]

["tool"."setuptools"."packages"."find"]
"where" = ["src"]
"include" = ["resources", "resources.*", "wood", "wood.*", "wood_project", "wood_project.*"]

["tool"."wood"]

["tool"."wood"."openproject"]
"project_id" = 3
"initiative_id" = 531
"release_id" = 24
"epic_id" = 532

["tool"."wood"."workflow"]
"output_directory" = "/private/tmp"

["tool"."wood"."branching"]
"strategy" = "integration"
"release_id" = 24
"integration_branch" = "development"
"scope_reference" = "https://projects.woodhost.cloud/work_packages/537; user approved closing completed planning release 26 and rolling Wood Tools scope to release 24 (Wood Pi Harness) on 2026-10-19; main integration, publication and deployment remain separately approved."

["tool"."wood"."architecture"]
"domain" = "engineering"
"capability" = "developer-tooling"
"kind" = "cli"

["tool"."pytest"]

["tool"."pytest"."ini_options"]
"testpaths" = ["tests"]
"addopts" = "-ra"
"markers" = ["unit: Unit tests", "integration: Integration tests"]

["tool"."mypy"]
"python_version" = "3.14"
"strict" = true
"files" = ["src/wood"]

["tool"."coverage"]

["tool"."coverage"."run"]
"branch" = true
"source" = ["wood"]

["tool"."coverage"."report"]
"fail_under" = 85
"show_missing" = true

["tool"."semantic_release"]
"commit_parser" = "conventional"
"commit_message" = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
"allow_zero_version" = true
"major_on_zero" = false
"tag_format" = "v{version}"
"version_toml" = ["pyproject.toml:project.version"]

["tool"."semantic_release"."branches"]

["tool"."semantic_release"."branches"."main"]
"match" = "^main$"
"prerelease" = false

["tool"."semantic_release"."commit_parser_options"]
"minor_tags" = ["feat"]
"patch_tags" = ["fix", "perf"]
"parse_squash_commits" = true
"ignore_merge_commits" = true

["tool"."semantic_release"."remote"]
"type" = "github"

["tool"."semantic_release"."remote"."token"]
"env" = "GITHUB_TOKEN"

["tool"."semantic_release"."publish"]
"upload_to_vcs_release" = true

["tool"."ruff"]
"line-length" = 100
"target-version" = "py314"

["tool"."ruff"."lint"]
"select" = ["E", "F", "I", "B", "UP"]
"ignore" = []

["tool"."ruff"."format"]
"quote-style" = "double"
"indent-style" = "space"
"line-ending" = "auto"
