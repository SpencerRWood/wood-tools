repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: block-runtime-env
        name: block staged runtime environment files
        entry: >-
          bash -c 'git diff --cached --name-only | grep -E "^\.env($|\.)" |
          grep -v "^\.env\.example$" >/dev/null &&
          { echo "Do not commit runtime environment files"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
