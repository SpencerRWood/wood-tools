{
  "name": "PR routing and release readiness",
  "on": {
    "pull_request": {
      "branches": [
        "development",
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "routing": {
      "name": "pr-routing",
      "runs-on": "ubuntu-latest",
      "outputs": {
        "incident": "${{ steps.route.outputs.incident }}",
        "approval": "${{ steps.route.outputs.approval }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v9.0.0"
        },
        {
          "name": "Install approved Wood tools",
          "env": {
            "WOOD_REVISION": "17cde0518cca29f4ff72d6a805011f6cc8471a8f",
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\ngh auth setup-git\ngit init \"$RUNNER_TEMP/wood-tools\"\ngit -C \"$RUNNER_TEMP/wood-tools\" remote add origin https://github.com/SpencerRWood/wood-tools.git\ngit -C \"$RUNNER_TEMP/wood-tools\" fetch --depth 1 origin \"$WOOD_REVISION\"\ngit -C \"$RUNNER_TEMP/wood-tools\" checkout --detach FETCH_HEAD\ntest \"$(git -C \"$RUNNER_TEMP/wood-tools\" rev-parse HEAD)\" = \"$WOOD_REVISION\"\nuv sync --frozen --directory \"$RUNNER_TEMP/wood-tools\"\necho \"$RUNNER_TEMP/wood-tools/.venv/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "id": "route",
          "name": "Verify PR routing and ancestry",
          "run": "wood repo route --event-file \"$GITHUB_EVENT_PATH\" --github-output \"$GITHUB_OUTPUT\" --json"
        }
      ]
    },
    "readiness": {
      "needs": "routing",
      "if": "github.base_ref == 'main'",
      "uses": "SpencerRWood/workflows/.github/workflows/release-readiness.yml@b2d37f136394a7c89abbd63004f5ffe99824283c",
      "with": {
        "workflow_revision": "b2d37f136394a7c89abbd63004f5ffe99824283c",
        "wood_revision": "17cde0518cca29f4ff72d6a805011f6cc8471a8f",
        "integration_command": "uv run --frozen pytest -q tests/test_migration.py tests/test_protection.py tests/test_hotfix.py tests/test_branching.py",
        "security_command": "git diff --check && uv run --frozen ruff check .",
        "deferred_stories": "{\"558\":\"Approved staged Wave 1 foundation only: https://projects.woodhost.cloud/work_packages/558 activity 1477; unfinished fleet acceptance retained in full; Story remains In progress.\"}",
        "hotfix_incident": "${{ needs.routing.outputs.incident }}",
        "hotfix_approval": "${{ needs.routing.outputs.approval }}"
      },
      "secrets": {
        "release_read_token": "${{ secrets.RELEASE_EVIDENCE_READ_TOKEN }}",
        "dbt_host": "${{ secrets.DBT_HOST }}",
        "dbt_user": "${{ secrets.DBT_USER }}",
        "dbt_password": "${{ secrets.DBT_PASSWORD }}",
        "dbt_port": "${{ secrets.DBT_PORT }}",
        "dbt_dbname": "${{ secrets.DBT_DBNAME }}",
        "dbt_schema": "${{ secrets.DBT_SCHEMA }}",
        "openproject_api_token": "${{ secrets.OPENPROJECT_API_TOKEN }}"
      }
    }
  }
}
