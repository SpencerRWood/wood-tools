name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Expected partial release tag; leave empty for normal release reconciliation.
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Immutable Story 517 recovery implementation (workflows PRs #31 and #32).
    uses: SpencerRWood/workflows/.github/workflows/release.yml@51100f648c0ebdb3291ef67165e0277990e32c64
    with:
      recovery_tag: ${{ inputs.recovery_tag || '' }}
