name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Expected partial release tag; leave empty for normal release reconciliation.
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Guarded foundation; workflow and helper source are pinned together.
    uses: SpencerRWood/workflows/.github/workflows/release.yml@69b3e703dc9a9b433087788d4ddd09039921f497
    with:
      workflow_revision: 69b3e703dc9a9b433087788d4ddd09039921f497
      recovery_tag: ${{ inputs.recovery_tag || '' }}
