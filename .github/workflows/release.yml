name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Expected partial release tag; leave empty for normal release reconciliation.
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Guarded foundation; workflow and helper source are pinned together.
    uses: SpencerRWood/workflows/.github/workflows/release.yml@1b806a4ebce73dcab2f0ecf26ffc47b00fac8ef7
    with:
      workflow_revision: 1b806a4ebce73dcab2f0ecf26ffc47b00fac8ef7
      recovery_tag: ${{ inputs.recovery_tag || '' }}
